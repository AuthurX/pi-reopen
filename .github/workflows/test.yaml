name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  platforms:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22.19.0"
          package-manager-cache: false
      - name: Native platform, extension lifecycle and recent-session tests
        run: npm run test:platform
      - name: Full regression suite
        if: runner.os == 'Linux'
        run: npm test
