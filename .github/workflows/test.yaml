name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  platforms:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22.19.0"
          package-manager-cache: false
      - name: Native platform, extension lifecycle and recent-session tests
        run: npm run test:platform
      - name: Full regression suite
        if: runner.os == 'Linux'
        run: npm test

  pack:
    name: Packaged tarball
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22.19.0"
          package-manager-cache: false
      - name: Verify tarball contents and run the packaged CLI
        run: npm run verify-pack

  pty:
    name: Real Pi PTY lifecycle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22.19.0"
          package-manager-cache: false
      - name: Install Pi host
        run: npm install -g --no-fund --no-audit @earendil-works/pi-coding-agent
      - name: Signal exit keeps the record, deliberate /quit removes it
        run: python3 test/pty-shutdown.py
