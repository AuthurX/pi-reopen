name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # 创建 GitHub Release
  id-token: write # npm provenance / trusted publishing (OIDC)

jobs:
  test:
    name: Release checks
    uses: ./.github/workflows/test.yaml
    permissions:
      contents: read

  publish:
    name: Publish to npm
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Check out release tag
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Verify tag matches package version
        run: |
          VERSION="v$(node -p "require('./package.json').version")"
          if [ "$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $VERSION"
            exit 1
          fi

      - name: Install dependencies
        run: npm install --no-fund --no-audit

      - name: Verify packaged tarball and CLI
        run: npm run verify-pack

      - name: Publish to npm
        run: |
          PKG_NAME="$(node -p "require('./package.json').name")"
          PKG_VERSION="$GITHUB_REF_NAME"
          if npm view "${PKG_NAME}@${PKG_VERSION#v}" version --json > "$RUNNER_TEMP/npm-view.json"; then
            echo "${PKG_NAME}@${PKG_VERSION#v} is already on npm; skipping"
          else
            # Only a missing version permits publishing; auth/network failures stop the job.
            jq -e '.error.code == "E404"' "$RUNNER_TEMP/npm-view.json"
            if [[ "$PKG_VERSION" == *-* ]]; then TAG=next; else TAG=latest; fi
            npm publish --provenance --tag "$TAG"
          fi

      - name: Publish scoped compatibility distribution
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if npm view "@ellieyujin/pi-reopen@$VERSION" version --json > "$RUNNER_TEMP/npm-legacy-view.json"; then
            echo "Scoped distribution already published; skipping"
          else
            jq -e '.error.code == "E404"' "$RUNNER_TEMP/npm-legacy-view.json"
            npm run publish-legacy -- --provenance
          fi

      - name: Create GitHub release
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
